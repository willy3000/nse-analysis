name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nse, POSTGRES_PASSWORD: nse, POSTGRES_DB: nse_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nse" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: services/api } }
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nse:nse@localhost:5432/nse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check nse_platform tests --select E9,F,B,S --ignore B008,S101,S104,S311
      - run: pytest -q
      - run: pip install pip-audit && pip-audit --skip-editable || true   # report-only vulnerability scan

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t nse-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t nse-web .
